name: Magnet To Cloud Drive

on:
  repository_dispatch:
    types: [start-download]

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq

      - name: Install Latest qBittorrent-nox Static
        run: |
          set -e
          DEPS_JSON=$(curl -fsSL "https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/dependency-version.json")
          QBT_VERSION=$(echo "$DEPS_JSON" | jq -r '.qbittorrent')
          LIBTORRENT_VERSION=$(echo "$DEPS_JSON" | jq -r '.libtorrent_2_0')
          QBT_TAG="release-${QBT_VERSION}_v${LIBTORRENT_VERSION}"
          QBT_URL="https://github.com/userdocs/qbittorrent-nox-static/releases/download/${QBT_TAG}/x86_64-qbittorrent-nox"
          QBT_BIN="$RUNNER_TEMP/qbittorrent-nox"
          curl -fL "$QBT_URL" -o "$QBT_BIN"
          chmod +x "$QBT_BIN"
          "$QBT_BIN" --version
          echo "QBT_BIN=$QBT_BIN" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install npm packages
        run: npm install axios

      - name: System Info
        run: |
          echo "=== System Info ==="
          echo "CPU: $(nproc) cores"
          echo "Disk: $(df -h / | tail -1 | awk '{print $4}') available"
          echo "================"

      - name: Get Trackers
        run: |
          ALL_TRACKERS=""
          XIU2=$(curl -fsSL --connect-timeout 15 "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/all.txt" 2>/dev/null | grep -v '^$' | tr '\n' ',' | sed 's/,$//' || echo "")
          if [ -n "$XIU2" ]; then ALL_TRACKERS="$XIU2"; fi
          NGOSANG=$(curl -fsSL --connect-timeout 15 "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt" 2>/dev/null | grep -v '^$' | tr '\n' ',' | sed 's/,$//' || echo "")
          if [ -n "$NGOSANG" ]; then
            if [ -n "$ALL_TRACKERS" ]; then ALL_TRACKERS="$ALL_TRACKERS,$NGOSANG"; else ALL_TRACKERS="$NGOSANG"; fi
          fi
          BACKUP="udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://open.demonii.com:1337/announce,udp://explodie.org:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://tracker.dler.org:6969/announce,udp://tracker.theoks.net:6969/announce"
          if [ -n "$ALL_TRACKERS" ]; then ALL_TRACKERS="$ALL_TRACKERS,$BACKUP"; else ALL_TRACKERS="$BACKUP"; fi
          ALL_TRACKERS=$(echo "$ALL_TRACKERS" | tr ',' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "TRACKERS=$ALL_TRACKERS" >> $GITHUB_ENV

      - name: Run Download Script
        env:
          MAGNET: ${{ github.event.client_payload.magnet }}
          STORAGE_CHANNEL: ${{ github.event.client_payload.storage_channel }}
          OD_CLIENT_ID: ${{ github.event.client_payload.od_client_id }}
          OD_CLIENT_SECRET: ${{ github.event.client_payload.od_client_secret }}
          OD_TENANT_ID: ${{ github.event.client_payload.od_tenant_id }}
          OD_REFRESH_TOKEN: ${{ github.event.client_payload.od_refresh_token }}
          OD_ROOT_PATH: ${{ github.event.client_payload.od_root_path }}
          GD_CLIENT_ID: ${{ github.event.client_payload.gd_client_id }}
          GD_CLIENT_SECRET: ${{ github.event.client_payload.gd_client_secret }}
          GD_REFRESH_TOKEN: ${{ github.event.client_payload.gd_refresh_token }}
          GD_ROOT_PATH: ${{ github.event.client_payload.gd_root_path }}
          UPLOAD_FOLDER: ${{ github.event.client_payload.upload_folder }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
          TASK_ID: ${{ github.event.client_payload.task_id }}
          TIMEOUT_HOURS: ${{ github.event.client_payload.timeout_hours }}
          BT_TRACKERS: ${{ env.TRACKERS }}
          QBT_HOST: http://127.0.0.1:8080
          QBT_USERNAME: admin
          QBT_PASSWORD: adminadmin
        run: node stream_upload.js
