# CNB 流水线配置 - 文件下载任务

"**":
  api_trigger_download:
    - name: file-download-task
      runner:
        tags: cnb:arch:amd64
        cpus: 1
      docker:
        image: node:24-slim
      stages:
        - name: Install deps
          script: |
            set -e
            echo "📦 安装依赖..."
            sed -i 's/deb.debian.org/mirrors.cloud.tencent.com/g' /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl jq xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libdbus-1-3 libfontconfig1 libfreetype6
            update-ca-certificates
            rm -rf /var/lib/apt/lists/*
            echo "✅ 依赖安装完成"

        - name: Install latest qBittorrent
          script: |
            set -e
            echo "📦 安装 qBittorrent 最新 release..."
            RELEASE_JSON=$(curl -fsSL "https://api.github.com/repos/qbittorrent/qBittorrent/releases/latest")
            QBT_VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
            QBT_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select((.name | endswith("_x86_64.AppImage")) and ((.name | contains("_lt20")) | not)) | .browser_download_url' | head -n 1)
            if [ -z "$QBT_URL" ]; then
              echo "❌ 未找到 qBittorrent x86_64 AppImage"
              exit 1
            fi
            curl -fL "$QBT_URL" -o /usr/local/bin/qbittorrent-release
            chmod +x /usr/local/bin/qbittorrent-release
            echo "✅ qBittorrent release: $QBT_VERSION"

        - name: System info
          script: |
            echo "=== 系统信息 ==="
            echo "CPU 核数: $(nproc || echo unknown)"
            echo "磁盘空间: $(df -h / | tail -1 | awk '{print $4}') 可用"
            echo "外网 IP: $(curl -fsSL --connect-timeout 5 ifconfig.me 2>/dev/null || echo unknown)"
            echo "================"

        - name: Get trackers
          script: |
            echo "📡 获取 Tracker 列表..."
            ALL_TRACKERS=""
            
            XIU2=$(curl -fsSL --connect-timeout 15 "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/all.txt" 2>/dev/null | grep -v '^$' | tr '\n' ',' | sed 's/,$//' || echo "")
            if [ -n "$XIU2" ]; then
              echo "✅ XIU2: $(echo "$XIU2" | tr ',' '\n' | grep -v '^$' | wc -l) trackers"
              ALL_TRACKERS="$XIU2"
            fi
            
            NGOSANG=$(curl -fsSL --connect-timeout 15 "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt" 2>/dev/null | grep -v '^$' | tr '\n' ',' | sed 's/,$//' || echo "")
            if [ -n "$NGOSANG" ]; then
              echo "✅ ngosang: $(echo "$NGOSANG" | tr ',' '\n' | grep -v '^$' | wc -l) trackers"
              if [ -n "$ALL_TRACKERS" ]; then ALL_TRACKERS="$ALL_TRACKERS,$NGOSANG"; else ALL_TRACKERS="$NGOSANG"; fi
            fi
            
            BACKUP="udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://open.demonii.com:1337/announce,udp://explodie.org:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://tracker.dler.org:6969/announce,udp://tracker.theoks.net:6969/announce"
            if [ -n "$ALL_TRACKERS" ]; then ALL_TRACKERS="$ALL_TRACKERS,$BACKUP"; else ALL_TRACKERS="$BACKUP"; fi
            
            ALL_TRACKERS=$(echo "$ALL_TRACKERS" | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
            echo "📊 共 $(echo "$ALL_TRACKERS" | tr ',' '\n' | grep -v '^$' | wc -l) 个唯一 Tracker"
            echo "$ALL_TRACKERS" > /tmp/trackers.txt

        - name: Download
          script: |
            set -e
            echo "=========================================="
            echo "🚀 开始下载"
            echo "=========================================="
            
            # 由调用方传入磁力链接，模板不内置测试资源。
            DOWNLOAD_URL="${DOWNLOAD_URL:-}"
            
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "❌ DOWNLOAD_URL is required"
              exit 1
            fi
            
            TIMEOUT_MINUTES="${TIMEOUT_MINUTES:-60}"
            echo "⏱️ 超时: ${TIMEOUT_MINUTES} 分钟"
            echo ""
            
            mkdir -p /downloads
            
            # 判断是磁力链接还是普通 URL
            if echo "$DOWNLOAD_URL" | grep -q "^magnet:"; then
              echo "🧲 检测到磁力链接"
              TRACKERS=$(cat /tmp/trackers.txt 2>/dev/null || echo "")
              
              mkdir -p /tmp/qbt-profile/qBittorrent/config
              printf '%s\n' \
                '[LegalNotice]' \
                'Accepted=true' \
                '' \
                '[Preferences]' \
                'WebUI\Enabled=true' \
                'WebUI\Port=8080' \
                'Downloads\SavePath=/downloads' \
                > /tmp/qbt-profile/qBittorrent/config/qBittorrent.conf
              QBT_ARGS="--webui-port=8080 --profile=/tmp/qbt-profile"
              if APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a /usr/local/bin/qbittorrent-release -h 2>&1 | grep -q -- "--confirm-legal-notice"; then
                QBT_ARGS="--confirm-legal-notice $QBT_ARGS"
              fi
              APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a /usr/local/bin/qbittorrent-release $QBT_ARGS > /tmp/qbt.log 2>&1 &
              QBT_PID=$!
              # 等到 Web API 可访问再登录，避免 runner 慢启动时误判失败。
              for i in $(seq 1 30); do
                if curl -fsSL http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1; then
                  break
                fi
                if ! kill -0 "$QBT_PID" 2>/dev/null; then
                  echo "❌ qBittorrent 启动失败"
                  cat /tmp/qbt.log || true
                  exit 1
                fi
                sleep 1
              done
              if ! curl -fsSL http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1; then
                echo "❌ qBittorrent Web API 未启动"
                cat /tmp/qbt.log || true
                exit 1
              fi
              TEMP_PASSWORD=$(grep -i "temporary password" /tmp/qbt.log | tail -1 | sed -E 's/.*temporary password[^:]*:[[:space:]]*([^[:space:]]+).*/\1/' || true)
              QBT_PASSWORD="${TEMP_PASSWORD:-adminadmin}"
              curl -fsSL -c /tmp/qbt.cookie -d "username=admin&password=${QBT_PASSWORD}" http://127.0.0.1:8080/api/v2/auth/login >/dev/null
              curl -fsSL -b /tmp/qbt.cookie -d "json={\"save_path\":\"/downloads\",\"temp_path_enabled\":false,\"start_paused_enabled\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences >/dev/null
              curl -fsSL -b /tmp/qbt.cookie \
                --data-urlencode "urls=${DOWNLOAD_URL}" \
                --data-urlencode "savepath=/downloads" \
                --data-urlencode "tags=cnb" \
                --data-urlencode "paused=false" \
                --data-urlencode "root_folder=true" \
                http://127.0.0.1:8080/api/v2/torrents/add >/dev/null

              HASH=""
              START_TS=$(date +%s)
              LAST_DOWNLOADED=0
              LAST_PROGRESS_TS=$START_TS
              while true; do
                NOW_TS=$(date +%s)
                if [ $((NOW_TS - START_TS)) -gt $((TIMEOUT_MINUTES * 60)) ]; then
                  echo "❌ 下载超时"
                  EXIT_CODE=124
                  break
                fi

                INFO=$(curl -fsSL -b /tmp/qbt.cookie "http://127.0.0.1:8080/api/v2/torrents/info?tag=cnb" || echo "[]")
                HASH=$(node -e "const data=JSON.parse(process.argv[1]||'[]'); console.log(data[0]?.hash||'')" "$INFO")
                NAME=$(node -e "const data=JSON.parse(process.argv[1]||'[]'); console.log(data[0]?.name||'metadata')" "$INFO")
                PROGRESS=$(node -e "const data=JSON.parse(process.argv[1]||'[]'); console.log(Math.floor((data[0]?.progress||0)*100))" "$INFO")
                DOWNLOADED=$(node -e "const data=JSON.parse(process.argv[1]||'[]'); console.log(data[0]?.downloaded||0)" "$INFO")
                SPEED=$(node -e "const data=JSON.parse(process.argv[1]||'[]'); console.log(data[0]?.dlspeed||0)" "$INFO")
                STATE=$(node -e "const data=JSON.parse(process.argv[1]||'[]'); console.log(data[0]?.state||'waiting')" "$INFO")

                if [ -n "$HASH" ] && [ -n "$TRACKERS" ]; then
                  curl -fsSL -b /tmp/qbt.cookie \
                    --data-urlencode "hash=${HASH}" \
                    --data-urlencode "urls=$(echo "$TRACKERS" | tr ',' '\n')" \
                    http://127.0.0.1:8080/api/v2/torrents/addTrackers >/dev/null || true
                  TRACKERS=""
                fi

                echo "qBittorrent: ${NAME} ${PROGRESS}% speed=${SPEED} state=${STATE}"
                if [ "$DOWNLOADED" -gt "$LAST_DOWNLOADED" ] || [ "$SPEED" -gt 0 ]; then
                  LAST_DOWNLOADED="$DOWNLOADED"
                  LAST_PROGRESS_TS="$NOW_TS"
                fi
                if [ "$PROGRESS" -ge 100 ] || [ "$STATE" = "uploading" ] || [ "$STATE" = "stalledUP" ]; then
                  EXIT_CODE=0
                  break
                fi
                if [ $((NOW_TS - LAST_PROGRESS_TS)) -gt 600 ]; then
                  echo "❌ 10分钟无下载进度"
                  EXIT_CODE=1
                  break
                fi
                sleep 15
              done
              kill "$QBT_PID" 2>/dev/null || true
              
              if [ "${EXIT_CODE:-0}" != "0" ]; then
                echo ""
                echo "⚠️ 磁力下载失败，可能原因："
                echo "   1. 资源无人做种（太冷门）"
                echo "   2. 磁力链接无效"
                echo "   3. 网络无法连接 DHT/Tracker"
              fi
            else
              echo "🔗 检测到普通 URL"
              echo "❌ CNB 测试流水线现在只用于磁力链接"
              EXIT_CODE=2
            fi
            
            echo ""
            echo "=========================================="
            if [ "${EXIT_CODE:-0}" = "0" ]; then
              echo "✅ 下载完成!"
            else
              echo "⚠️ 退出码: ${EXIT_CODE:-unknown}"
            fi
            echo ""
            echo "📁 下载目录:"
            ls -lah /downloads/
            du -sh /downloads/* 2>/dev/null || echo "无文件"
            echo "=========================================="

            exit "${EXIT_CODE:-0}"
